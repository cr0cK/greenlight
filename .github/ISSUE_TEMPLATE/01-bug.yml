name: Bug report
description: Something in Greenlight does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Greenlight menu
        2. Type `repo 42` in quick open
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Greenlight version
      description: Shown under About at the bottom of the Greenlight preferences.
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: GNOME Shell version and distribution
      description: Output of `gnome-shell --version`, plus your distribution.
      placeholder: GNOME Shell 49.1, Fedora 43
    validations:
      required: true
  - type: input
    id: gh
    attributes:
      label: GitHub CLI version
      description: Output of `gh --version`.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `journalctl --user -b -o cat /usr/bin/gnome-shell | grep -i greenlight`.
      render: text
