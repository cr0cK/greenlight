# On every push to main, release-please opens or updates a release PR that bumps
# package.json, metadata.json version-name, and CHANGELOG.md from Conventional Commits.
# Merging that PR tags vX.Y.Z and publishes a GitHub Release; the package job then
# attaches the installable extension zip to it.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GitHub fires no workflow for a PR opened with GITHUB_TOKEN, except a dispatch, so run
      # the PR checks on the release branch; they report on the release PR's head commit.
      - name: Run PR checks on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: gh workflow run pr-checks.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"

  package:
    name: Attach extension zip
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - name: Install build tools
        run: dnf install -y --setopt=install_weak_deps=False gnome-shell glib2 make nodejs npm git gh

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build the extension zip
        run: |
          npm ci
          make check

      - name: Upload the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/*.shell-extension.zip --clobber --repo "$GITHUB_REPOSITORY"
