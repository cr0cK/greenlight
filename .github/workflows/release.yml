# On every push to main, release-please opens or updates a release PR that bumps
# package.json, metadata.json version-name, and CHANGELOG.md from Conventional Commits.
# Merging that PR tags vX.Y.Z and publishes a GitHub Release; the package job then
# attaches the installable extension zip to it.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GitHub fires no workflow for a PR opened with GITHUB_TOKEN, except a dispatch, so run
      # the PR checks on the release branch; they report on the release PR's head commit.
      # The PR output is parsed in the shell: GitHub evaluates step env even when the step is
      # skipped, and fromJSON fails the run on an empty output.
      - name: Run PR checks on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -r .headBranchName <<<"$PR")
          gh workflow run pr-checks.yml --ref "$branch" --repo "$GITHUB_REPOSITORY"

  package:
    name: Attach extension zip
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - name: Install build tools
        run: dnf install -y --setopt=install_weak_deps=False gnome-shell glib2 make nodejs npm git gh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build the extension zip
        run: |
          npm ci
          make check

      - name: Upload the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/*.shell-extension.zip --clobber --repo "$GITHUB_REPOSITORY"
